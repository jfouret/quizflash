<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QuizDeck{% endblock %}</title>
  <script>
    // Apply saved theme before first paint: no attribute = follow system.
    (function () {
      var theme = localStorage.getItem('quizdeck-theme') || 'auto';
      if (theme !== 'auto') document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body hx-boost="true">
  <header>
    <nav class="container">
      <ul>
        <li><strong>QuizDeck</strong></li>
      </ul>
      <ul>
        <li><a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
          Decks</a></li>
        <li><a href="/study" {% if request.url.path.startswith('/study') %}aria-current="page"{% endif %}>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3V9z"/></svg>
          Study</a></li>
        <li><a href="/settings" {% if request.url.path.startswith('/settings') %}aria-current="page"{% endif %}>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings</a></li>
        <li><button id="theme-toggle" type="button" class="secondary outline" aria-label="Switch color theme" title="Theme: system">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>
        </button></li>
      </ul>
    </nav>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer class="container"><small class="muted">Self-hosted spaced-repetition quizzes</small></footer>
  {% block scripts %}{% endblock %}
  <script>
    (function () {
      var button = document.getElementById('theme-toggle');
      var order = ['auto', 'light', 'dark'];
      var labels = {auto: 'Theme: system', light: 'Theme: light', dark: 'Theme: dark'};
      function current() {
        return localStorage.getItem('quizdeck-theme') || 'auto';
      }
      function apply() {
        var theme = current();
        if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', theme);
        button.title = labels[theme];
      }
      button.addEventListener('click', function () {
        var next = order[(order.indexOf(current()) + 1) % order.length];
        localStorage.setItem('quizdeck-theme', next);
        apply();
      });
      apply();
    })();
  </script>
</body>
</html>
